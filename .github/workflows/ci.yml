name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '\.pb\.go' || true)
          if [ -n "$out" ]; then echo "未格式化:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: static cross build
        run: make build-linux
