syntax = "proto3";

package cagent.v1;

option go_package = "github.com/crazychengmm/cagent/proto/cagent/v1;cagentv1";

import "google/protobuf/timestamp.proto";

// ManagementService 是 cagent ctl 使用的管理 API（admin 端口 + token 鉴权）。
service ManagementService {
  // enrollment token 管理
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // agent 清单
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ShowAgent(ShowAgentRequest) returns (ShowAgentResponse);

  // 任务
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ShowJob(ShowJobRequest) returns (ShowJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // 发布与升级
  rpc PublishRelease(stream PublishReleaseChunk) returns (PublishReleaseResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
}

message TokenInfo {
  string id = 1;
  string description = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
  google.protobuf.Timestamp last_used_at = 7;
}

message CreateTokenRequest {
  int64 ttl_seconds = 1; // 0 表示用服务端默认（168h）
  string description = 2;
}
message CreateTokenResponse {
  string plaintext = 1; // 仅创建时返回一次
  TokenInfo token = 2;
}

message ListTokensRequest {}
message ListTokensResponse {
  repeated TokenInfo tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}
message RevokeTokenResponse {}

message AgentInfo {
  string id = 1;
  string hostname = 2;
  map<string, string> labels = 3;
  string version = 4;
  string status = 5;
  google.protobuf.Timestamp last_heartbeat_at = 6;
  google.protobuf.Timestamp cert_not_after = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message ShowAgentRequest {
  string id = 1;
}
message ShowAgentResponse {
  AgentInfo agent = 1;
}

message RunJobRequest {
  map<string, string> selector = 1;
  string command = 2;
  string working_dir = 3;
  map<string, string> extra_env = 4;
  int64 timeout_seconds = 5;
}
message RunJobResponse {
  repeated string job_ids = 1;
  int32 matched = 2;
}

message JobInfo {
  string job_id = 1;
  string agent_id = 2;
  string kind = 3;
  string command = 4;
  string working_dir = 5;
  map<string, string> extra_env = 6;
  int64 timeout_seconds = 7;
  string requested_by = 8;
  string status = 9;
  optional int32 exit_code = 10;
  bool truncated = 11;
  string message = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
}

message OutputChunkInfo {
  int64 seq = 1;
  string stream = 2;
  bytes data = 3;
}

message ListJobsRequest {
  string agent_id = 1;
  string status = 2;
  int32 limit = 3;
}
message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

message ShowJobRequest {
  string id = 1;
}
message ShowJobResponse {
  JobInfo job = 1;
  repeated OutputChunkInfo output = 2;
}

message CancelJobRequest {
  string id = 1;
}
message CancelJobResponse {}

message ReleaseMeta {
  string version = 1;
  string sha256_hex = 2;
  int64 size = 3;
  bytes signature = 4; // 对整个 tar.gz 包的 ed25519 签名
}

message PublishReleaseChunk {
  oneof chunk {
    ReleaseMeta meta = 1;
    bytes data = 2;
  }
}
message PublishReleaseResponse {
  string version = 1;
}

message ListReleasesRequest {}
message ListReleasesResponse {
  repeated ReleaseInfo releases = 1;
}
message ReleaseInfo {
  string version = 1;
  int64 size = 2;
  string sha256_hex = 3;
  string uploaded_by = 4;
  google.protobuf.Timestamp uploaded_at = 5;
}

message UpgradeRequest {
  map<string, string> selector = 1;
  string version = 2;
  bool allow_downgrade = 3;
}
message UpgradeResponse {
  repeated string job_ids = 1;
  int32 matched = 2;
}
